# Local stack: Postgres + pgvector, a one-off init job (ingest, seed, train, tune), the API,
# and the MCP server over HTTP for external MCP clients.
#
#   docker compose up --build        # first run takes a few minutes (fetch + index docs)
#   open http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  init:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/assistant
    command: >
      sh -c "assistant ingest && assistant seed && assistant train && assistant tune"
    volumes: [appdata:/app/data, ./evals:/app/evals]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/assistant
    ports: ["8000:8000"]
    volumes: [appdata:/app/data, ./reports:/app/reports]
    depends_on:
      init: { condition: service_completed_successfully }

  mcp:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/assistant
      MCP_PORT: "8765"
    command: ["python", "-m", "enterprise_assistant.mcp_server", "--http"]
    ports: ["8765:8765"]
    depends_on:
      init: { condition: service_completed_successfully }

volumes:
  pgdata:
  appdata:
